name: Unzip wifiguard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip contents to repo root
        run: |
          set -eux
          rm -rf /tmp/wg
          mkdir -p /tmp/wg
          unzip -o wifiguard.zip -d /tmp/wg
          rm -f wifiguard.zip
          cd /tmp/wg/wifiguard
          shopt -s dotglob nullglob
          for item in *; do
            if [ "$item" = ".github" ]; then continue; fi
            mv "$item" "$GITHUB_WORKSPACE/"
          done
          if [ -d .github ]; then
            mkdir -p "$GITHUB_WORKSPACE/.github"
            for item in .github/*; do
              if [ "$item" = ".github/workflows" ]; then continue; fi
              cp -r "$item" "$GITHUB_WORKSPACE/.github/"
            done
            if [ -f .github/workflows/ci.yml ]; then
              mkdir -p "$GITHUB_WORKSPACE/.ci-staged"
              cp .github/workflows/ci.yml "$GITHUB_WORKSPACE/.ci-staged/ci.yml"
            fi
          fi

      - name: Commit extracted tree
        run: |
          set -eux
          git config user.name "tahiryounas604"
          git config user.email "tahiryounas604@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Extract wifiguard.zip contents into repo root" || echo "nothing to commit"
          git push
